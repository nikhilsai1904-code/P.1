<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>I'm Sorry</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e2de2);
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      animation: appear 1s ease;
    }

    .heart {
      font-size: 75px;
      animation: heartbeat 1.4s infinite;
    }

    h1 {
      margin: 15px 0;
      font-size: 42px;
    }

    .message {
      margin: 20px auto;
      max-width: 420px;
      line-height: 1.8;
      font-size: 18px;
    }

    button {
      margin-top: 18px;
      padding: 13px 27px;
      border: none;
      border-radius: 30px;
      color: #e84366;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    #response {
      display: none;
      margin-top: 22px;
      font-size: 19px;
      font-weight: bold;
      animation: appear 0.6s ease;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      animation: float 10s infinite ease-in;
    }

    .bubble:nth-child(1) {
      left: 10%;
      animation-delay: 1s;
    }

    .bubble:nth-child(2) {
      left: 30%;
      width: 55px;
      height: 55px;
      animation-delay: 3s;
    }

    .bubble:nth-child(3) {
      left: 70%;
      width: 45px;
      height: 45px;
      animation-delay: 2s;
    }

    .bubble:nth-child(4) {
      left: 88%;
      animation-delay: 5s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.18);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 34px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <main class="card">
    <div class="heart">💖</div>

    <h1>I'm Sorry</h1>

    <p class="message">
      I know I made a mistake, and I truly regret it.
      Please forgive me. You are very important to me,
      and I never wanted to hurt you.
    </p>

    <button onclick="showMessage()">
      Click if you forgive me
    </button>

    <p id="response">
      Thank you for giving me another chance! 🥺💗
    </p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("response").style.display = "block";
    }
  </script>

</body>
</html>
